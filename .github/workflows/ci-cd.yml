# BIST Pusula — GitHub'da her push'ta çalışan gerçek testler (eski şablon CI bu projeye ait değildi ve hep düşüyordu).
# Tam test (arayüz + yerel sunucu dahil) yerelde: bash tests/run.sh
name: Testler
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Sözdizimi ve birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sözdizimi (sunucu + motor + terminal)
        run: |
          for f in worker/src/*.js pc/bot.js; do node --check "$f"; done
          python3 - <<'PY'
          import re,subprocess,sys
          s=open('index.html',encoding='utf-8').read()
          open('/tmp/s.js','w').write('\n;\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          sys.exit(subprocess.run(['node','--check','/tmp/s.js']).returncode)
          PY
      - name: Karne, KAP, KAP geçmişi, pozisyon, kâğıt bot
        run: |
          cd tests
          for t in sig.mjs kap.mjs kaph.mjs pos.mjs paper.mjs; do echo "== $t"; node "$t"; done
