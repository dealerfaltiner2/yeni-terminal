name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy_vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Vercel secrets are configured
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID secret" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID secret" && exit 1)

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Load runtime endpoint variables
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const allowed = new Set([
            'WORKER_URL',
            'TRADINGVIEW_SCANNER_BASE',
            'TWELVE_DATA_BASE',
            'BINANCE_BASE',
            'COINGECKO_BASE'
          ]);

          const envFilePath = '.vercel/.env.production.local';
          if (!fs.existsSync(envFilePath)) process.exit(0);

          const output = [];
          const lines = fs.readFileSync(envFilePath, 'utf8').split(/\r?\n/);
          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;

            const separator = line.indexOf('=');
            if (separator <= 0) continue;

            const key = line.slice(0, separator).trim().replace(/^export\s+/, '');
            if (!allowed.has(key)) continue;

            let value = line.slice(separator + 1).trim();
            if (
              (value.startsWith('\"') && value.endsWith('\"')) ||
              (value.startsWith(\"'\") && value.endsWith(\"'\"))
            ) {
              value = value.slice(1, -1);
            }

            output.push(`${key}=${value}`);
          }

          if (output.length) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${output.join('\\n')}\\n`);
          }
          NODE

      - name: Deploy to production
        run: npm run deploy:ci
